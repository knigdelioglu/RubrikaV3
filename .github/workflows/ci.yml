name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply validated source fixes and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/commands/mobile_connection_commands.rs')
          text = path.read_text()
          text = text.replace(
              'use serde::Serialize;\nuse std::process::Command;\n',
              'use serde::Serialize;\n#[cfg(target_os = "macos")]\nuse std::process::Command;\n',
          )
          path.write_text(text)

          path = Path('src-tauri/src/services/model_platform_migration_service.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::domain::model::{ModelMode, ModelProfile, ModelRuntimePreset, PrivacyMode};',
              'use crate::domain::model::{ModelMode, ModelProfile, ModelRuntimePreset};',
          )
          text = text.replace('use std::path::{Path, PathBuf};', 'use std::path::PathBuf;')
          path.write_text(text)

          path = Path('src-tauri/src/services/model_capability_probe_service.rs')
          text = path.read_text()
          old = '''        Ok(CapabilityManifest {
              model_definition_id: model.id,
              runtime_definition_id: runtime.id,
              model_fingerprint: model.model_fingerprint,
              runtime_fingerprint: fingerprint_runtime_definition(&runtime),
              verified_at: Utc::now().to_rfc3339(),
              results,
          })'''
          new = '''        let runtime_fingerprint = fingerprint_runtime_definition(&runtime);
          Ok(CapabilityManifest {
              model_definition_id: model.id,
              runtime_definition_id: runtime.id,
              model_fingerprint: model.model_fingerprint,
              runtime_fingerprint,
              verified_at: Utc::now().to_rfc3339(),
              results,
          })'''
          text = text.replace(old, new)
          path.write_text(text)

          path = Path('src/pages/ModelLabPage.tsx')
          text = path.read_text()
          text = text.replace(
              'title="Gelişmiş: manuel metrik girişi" subtitle="Otomatik golden raporu bulunmayan scoring/speaking gibi task\'larda versioned policy gözlemleri elle içe aktarılabilir."',
              'title="Gelişmiş: manuel tanılama metrikleri" subtitle="Scoring/speaking gibi task’larda manuel gözlem kaydedilebilir; bu kayıtlar yalnız tanılama içindir ve Production promotion gate’ini açmaz."',
          )
          text = text.replace('Manuel gate’i değerlendir ve kaydet', 'Manuel tanılamayı değerlendir ve kaydet')
          path.write_text(text)
          PY
          (cd src-tauri && cargo fmt --all)

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "fix: clear local model platform quality gate"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Run quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run quality 2>&1 | tee quality.log

      - name: Upload quality log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-log
          path: quality.log
          if-no-files-found: warn
